openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PDF Watermarking and Tracking System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: pdfs
    description: PDF operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      description: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      description: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      description: Returns the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pdfs:
    get:
      operationId: listPdfs
      tags: [pdfs]
      summary: List available PDFs
      description: Returns all PDFs available for download
      responses:
        "200":
          description: List of PDFs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PdfFile"

  /admin/pdfs:
    post:
      operationId: uploadPdf
      tags: [admin]
      summary: Upload a PDF
      description: Admin uploads a new PDF to the system (multipart/form-data with field 'file')
      responses:
        "201":
          description: Uploaded PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfFile"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/search:
    get:
      operationId: searchBySerial
      tags: [admin]
      summary: Search by serial number
      description: Find user and download history by serial number
      parameters:
        - name: sn
          in: query
          required: true
          schema:
            type: string
          description: Serial number to search for
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [user, admin]
        serialNumber:
          type: ["string", "null"]

    PdfFile:
      type: object
      required: [id, filename, uploadedAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        uploadedAt:
          type: string

    DownloadRecord:
      type: object
      required: [id, pdfId, filename, downloadedAt]
      properties:
        id:
          type: integer
        pdfId:
          type: integer
        filename:
          type: string
        downloadedAt:
          type: string

    SearchResult:
      type: object
      required: [user, downloads]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/DownloadRecord"
